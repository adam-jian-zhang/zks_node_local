---
- hosts: all
  become: true
  vars:
    golang_version: 1.26.3
    # arch: arm64
    # user: zhangjian # change to the os user
    tools:
      - jq
      - git
      - tree
      - curl
      - cowsay
      - inotify-tools
      - make
      - gcc
      - unzip
      - libyaml-dev
      - libssl-dev
      - genisoimage
  roles:
    - {role: tools, tag: ['dev']}
    - {role: kubectl, tag: ['dev']}
    - {role: helm, tag: ['dev']}
    - {role: nats, tag: ['dev']}
    - {role: yq, tag: ['dev']}
    - {role: golang, tag: ['dev']}
    - {role: mise, tag: ['dev']}
    - {role: mise-erlang, tag: ['dev']}
